<div class="login-auth-page">
  <div class="login-auth-wrapper">
      <h3 class="login-text">Sistema de Inventario.</h3>
      <h3 class="login-text"> Control de medicamentos y uniformes</h3>
      <div class="separator"></div>
      <form  class="login-auth-form">
          <div class="form-group">
              <label for="email">Usuario</label>
              <input formControlName="email" type="text"  class="form-input">
          </div>
          <div class="form-group">
              <label for="password">Contraseña</label>
              <input formControlName="password" type="password"  class="form-input">
          </div>
          <div class="form-steps">
              <a class="link" href="">¿Se te ha olvidado la contraseña?</a>
          </div>
          <div>
              Ocurrio un error con tu email o password
          </div>
          <div class="form-action">
              <button [disabled]="formLogin.invalid" class="login social-btn">Iniciar sesión</button>
          </div>
      </form>
  </div>
</div>
