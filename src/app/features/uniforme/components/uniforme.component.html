<div class="contenerdor grid grid-cols-1 md:grid-cols-3 gap-3">
  <!-- Columna izquierda -->
  <div>
    <h2 class="text-xl font-bold text-neutral">UNIFORME</h2>
    <h2 class="text-lg mb-4 text-neutral">Gestión de Uniforme en inventario</h2>

    <div class="card formulario-registro p-4 shadow-lg">
      <!-- Menú de búsqueda -->
      <div class="mb-4">
        <h2 class="font-semibold mb-2 text-lg text-neutral">Buscar Uniforme</h2>
        <label class="input flex items-center gap-2 input-seach">
          <svg
            class="h-5 w-5 opacity-50"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
          >
            <g
              stroke-linejoin="round"
              stroke-linecap="round"
              stroke-width="2.5"
              fill="none"
              stroke="currentColor"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.3-4.3"></path>
            </g>
          </svg>
          <input type="search" class="text-neutral" placeholder="Search" />
        </label>
      </div>

      <!-- Estado -->
      <div class="mb-4">
        <h2 class="font-semibold mb-2 text-lg text-neutral">Estado</h2>
        <select
          class="select select-neutral w-full filtro-busqueda text-neutral"
          [(ngModel)]="estadoFiltro"
        >
          <option disabled selected>Seleccione estado</option>
          <option>Disponible</option>
          <option>Agotado</option>
          <option>Próximo a vencer</option>
        </select>
      </div>

      <div>
        <button class="btn" onclick="my_modal_5.showModal()">
          Registrar Uniforme
        </button>
      </div>

      <div></div>
    </div>
  </div>

  <!-- Iterar medicamentos con *ngFor -->
  <div class="Card-container grid gap-2">
    <div
      *ngFor="let uniforme of uniformeFiltrados"
      class="card card-medicamentos p-4 shadow-md"
    >
      <div>
        <div class="flex justify-between items-center">
          <h2 class="font-bold text-info">{{ uniforme.name }}</h2>
          <span [class]="'badge ' + getBadgeClass(uniforme.estado || '')">
            {{ uniforme.estado || "Disponible" }}
          </span>
        </div>
        <div class="mt-2">
          <p class="text-neutral">
            Stock actual:
            <span class="font-bold">{{ uniforme.stock_actual || 0 }}</span>
          </p>
          <p class="text-neutral">
            Stock mínimo:
            <span class="font-bold">{{ uniforme.stock_minimo || 0 }}</span>
          </p>
        </div>
        <div class="mt-3">
          <button
            class="btn btn-wide btn-primary"
            (click)="seleccionarUniforme(uniforme)"
            (click)="abrirModal('my_modal_4')"
          >
            Registrar Entrega
          </button>
        </div>
      </div>
    </div>
  </div>

  <!--Paginado de pagina -->
  <div class="join">
    <input
      class="join-item btn color-paginado text-neutral"
      type="radio"
      name="options"
      aria-label="1"
      checked="checked"
    />
    <input
      class="join-item btn btn-square color-paginado text-neutral"
      type="radio"
      name="options"
      aria-label="2"
    />
    <input
      class="join-item btn btn-square color-paginado text-neutral"
      type="radio"
      name="options"
      aria-label="3"
    />
    <input
      class="join-item btn btn-square color-paginado text-neutral"
      type="radio"
      name="options"
      aria-label="4"
    />
  </div>

  <!--Modal para registrar nuevo uniforme-->
  <dialog id="my_modal_5" class="modal modal-bottom sm:modal-middle">
    <div class="modal-box">
      <h3 class="text-lg font-bold mb-4">Registrar nuevo Uniforme</h3>

      <form (ngSubmit)="registrarUniforme()" #formMedicamento="ngForm">
        <!-- Nombre -->
        <div class="form-control mb-3">
          <label class="label">
            <span class="label-text">Nombre</span>
          </label>
          <input
            type="text"
            class="input input-bordered w-full"
            [(ngModel)]="nuevouniforme.name"
            name="name"
            required
          />
        </div>

        <!-- Stock actual -->
        <div class="form-control mb-3">
          <label class="label">
            <span class="label-text">Stock actual</span>
          </label>
          <input
            type="number"
            class="input input-bordered w-full"
            [(ngModel)]="nuevouniforme.stock_actual"
            name="stock_actual"
            min="0"
            required
          />
        </div>

        <!-- Stock mínimo -->
        <div class="form-control mb-3">
          <label class="label">
            <span class="label-text">Stock mínimo</span>
          </label>
          <input
            type="number"
            class="input input-bordered w-full"
            [(ngModel)]="nuevouniforme.stock_minimo"
            name="stock_minimo"
            min="0"
            required
          />
        </div>

        <!-- Estado -->
        <div class="form-control mb-3">
          <label class="label">
            <span class="label-text">Estado</span>
          </label>
          <select
            class="select select-bordered w-full"
            [(ngModel)]="nuevouniforme.estado"
            name="estado"
            required
          >
            <option [ngValue]="true">Activo</option>
            <option [ngValue]="false">Inactivo</option>
          </select>
        </div>

        <!-- Fechas -->
        <div class="form-control mb-3">
          <label class="label">
            <span class="label-text">Fecha de ingreso</span>
          </label>
          <input
            type="date"
            class="input input-bordered w-full"
            [(ngModel)]="nuevouniforme.fecha_ingreso"
            name="fecha_ingreso"
            required
          />
        </div>

        <div class="form-control mb-3">
          <label class="label">
            <span class="label-text">Fecha de vencimiento</span>
          </label>
          <input
            type="date"
            class="input input-bordered w-full"
            [(ngModel)]="nuevouniforme.fecha_vencimiento"
            name="fecha_vencimiento"
            required
          />
        </div>

        <div class="modal-action">
          <button
            type="submit"
            [disabled]="!formMedicamento.form.valid"
            class="btn btn-primary"
          >
            Agregar
          </button>
          <button type="button" class="btn" onclick="my_modal_5.close()">
            Cancelar
          </button>
        </div>
      </form>
    </div>
  </dialog>

  <!--Modal de Registro medicamento-->
  <dialog id="my_modal_4" class="modal">
    <div class="modal-box w-11/12 max-w-lg">
      <h3 class="font-bold text-lg mb-4">Registrar Nueva Entrega</h3>

      <form (ngSubmit)="registrarEntrega()" #entregaForm="ngForm">
        <!-- Departamento -->
        <div class="form-control mb-3">
          <label class="label">
            <span class="label-text">Area</span>
          </label>
          <input
            type="text"
            [(ngModel)]="nuevaEntrega.area"
            name="Area"
            required
            class="input input-bordered w-full"
          />
        </div>
        <!-- Medicamento -->
        <div class="form-control mb-3">
          <label class="label">
            <span class="label-text">Medicamento</span>
          </label>
          <select
            [(ngModel)]="nuevaEntrega.uniforme_id"
            name="medicamento_id"
            required
            class="select select-bordered w-full"
          >
            <option [ngValue]="0" disabled>Seleccione un medicamento</option>
            <option *ngFor="let m of uniforme" [ngValue]="m.id">
              {{ m.name }}
            </option>
          </select>
        </div>

        <!-- Cantidad -->
        <div class="form-control mb-3">
          <label class="label">
            <span class="label-text">Cantidad</span>
          </label>
          <input
            type="number"
            [(ngModel)]="nuevaEntrega.cantidad"
            name="cantidad"
            required
            class="input input-bordered w-full"
            min="1"
          />
        </div>

        <!-- Firma -->
        <div class="form-control mb-3">
          <label class="label">
            <span class="label-text">Firma digital</span>
          </label>
          <input
            type="text"
            [(ngModel)]="nuevaEntrega.firma"
            name="firma"
            required
            class="input input-bordered w-full"
          />
        </div>

        <!-- Empleado -->
        <div class="form-control mb-3">
          <label class="label">
            <span class="label-text">Empleado</span>
          </label>
          <select
            [(ngModel)]="nuevaEntrega.empleado_id"
            name="empleado_id"
            required
            class="select select-bordered w-full"
          >
            <option [ngValue]="0" disabled>Seleccione un empleado</option>
            <option *ngFor="let empleado of empleado" [ngValue]="empleado.id">
              {{ empleado.nombre }} {{ empleado.apellido }}
            </option>
          </select>
        </div>

        <!-- Botones -->
        <div class="modal-action">
          <button
            type="submit"
            [disabled]="!entregaForm.form.valid"
            class="btn btn-primary"
          >
            Guardar
          </button>
          <button type="button" class="btn" (click)="cerrarModal('my_modal_4')">
            Cerrar
          </button>
        </div>
      </form>
    </div>
  </dialog>
</div>
